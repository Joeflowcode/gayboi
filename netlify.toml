[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/locations/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "http://northwestjunkpros.com/*"
  to = "https://northwestjunkpros.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.northwestjunkpros.com/*"
  to = "https://northwestjunkpros.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.northwestjunkpros.com/*"
  to = "https://northwestjunkpros.com/:splat"
  status = 301
  force = true
